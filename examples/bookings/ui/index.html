<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings</title>
<style>
  :root { --ink: #1e242b; --muted: #6b7680; --rule: #d9dee3; --accent: #255b80; --bad: #a33; --ok: #2a7; --amber: #9a6a1c; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: #f5f6f8; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .info { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
  form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 14px; background: #fff; border: 1px solid var(--rule); padding: 16px; border-radius: 6px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); }
  input[type=checkbox] { padding: 0; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); grid-column: span 2; }
  .msg { margin: 12px 0; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
  .msg.err { background: #fbe9e7; color: var(--bad); }
  .msg.ok { background: #e6f4ee; color: #1d5c3f; }
  h2 { font-size: 15px; margin: 28px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { font-weight: normal; font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--rule); border-radius: 6px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef1f4; white-space: nowrap; }
  .status.Confirmed { background: #e6f4ee; color: #1d5c3f; }
  .status.Waitlisted { background: #fbf1dc; color: var(--amber); }
  .status.Cancelled { background: #f0f0f0; color: var(--muted); text-decoration: line-through; }
  .attendees { color: var(--muted); font-size: 12px; }
  .actions button { margin-right: 6px; padding: 3px 8px; font-size: 13px; }
  .empty { color: var(--muted); padding: 12px; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .cap { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main id="root"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const PAGE_SIZE = 5;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || data.panic || data.error || res.statusText);
  return data;
}

function toIso(date, time) {
  return new Date(`${date}T${time}:00`).toISOString();
}

function fmt(iso) {
  return new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}

function App() {
  const today = new Date().toISOString().slice(0, 10);
  const [info, setInfo] = useState(null);
  const [stats, setStats] = useState([]);
  const [room, setRoom] = useState("boardroom");
  const [guest, setGuest] = useState("alice");
  const [attendees, setAttendees] = useState("");
  const [waitlist, setWaitlist] = useState(false);
  const [date, setDate] = useState(today);
  const [start, setStart] = useState("10:00");
  const [end, setEnd] = useState("11:00");
  const [page, setPage] = useState({ items: [], total: 0, offset: 0, limit: PAGE_SIZE });
  const [offset, setOffset] = useState(0);
  const [msg, setMsg] = useState(null);

  const rooms = stats.map(s => s.room).sort();
  const current = stats.find(s => s.room === room);

  async function refresh(r = room, o = offset) {
    try {
      const [p, s] = await Promise.all([
        api("GET", `/page?room=${encodeURIComponent(r)}&offset=${o}&limit=${PAGE_SIZE}`),
        api("GET", "/stats"),
      ]);
      setPage(p);
      setStats(s);
    } catch (e) {
      setMsg({ kind: "err", text: e.message });
    }
  }

  useEffect(() => { api("GET", "/info").then(setInfo).catch(() => setInfo(null)); }, []);
  useEffect(() => { refresh(room, offset); }, [room, offset]);

  async function run(label, fn) {
    setMsg(null);
    try {
      const result = await fn();
      setMsg({ kind: "ok", text: label + (result && result.id ? ` (id ${result.id.slice(0, 8)}…)` : "") });
      await refresh();
    } catch (e) {
      setMsg({ kind: "err", text: e.message });
    }
  }

  function book(ev) {
    ev.preventDefault();
    const names = attendees.split(",").map(s => s.trim()).filter(Boolean);
    run(waitlist ? "Requested (waitlisted if the slot is taken)" : "Booked", () =>
      api("POST", "/booking", { room, guest, start: toIso(date, start), end: toIso(date, end), attendees: names, waitlist }));
  }

  const confirm = (id) => run("Confirmed", () => api("POST", "/confirm", { room, id }));
  const cancel = (id) => run("Cancelled", () => api("DELETE", `/booking?room=${room}&id=${id}&reason=${encodeURIComponent("cancelled from ui")}`));

  const pages = Math.max(1, Math.ceil(page.total / PAGE_SIZE));
  const pageNo = Math.floor(offset / PAGE_SIZE) + 1;

  return (
    <>
      <header>
        <div>
          <h1>Room bookings</h1>
          <p className="sub">A Trebuchet service. Attendees count against capacity; a taken slot can be waitlisted and is promoted when the holder cancels.</p>
        </div>
        {info && <div className="info">{info.host} · {info.rooms} rooms · v{info.version}</div>}
      </header>

      <form onSubmit={book}>
        <label>Room
          <select value={room} onChange={e => { setRoom(e.target.value); setOffset(0); }}>
            {(rooms.length ? rooms : [room]).map(r => <option key={r} value={r}>{r}</option>)}
          </select>
          {current && <span className="cap">{current.name}, holds {current.capacity}</span>}
        </label>
        <label>Guest <input value={guest} onChange={e => setGuest(e.target.value)} required /></label>
        <label>Attendees, comma separated <input value={attendees} onChange={e => setAttendees(e.target.value)} placeholder="bob, carol" /></label>
        <label>Date <input type="date" value={date} onChange={e => setDate(e.target.value)} required /></label>
        <label style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <span style={{ gridColumn: "span 2" }}>Start / end</span>
          <input type="time" value={start} onChange={e => setStart(e.target.value)} required />
          <input type="time" value={end} onChange={e => setEnd(e.target.value)} required />
        </label>
        <label className="check"><input type="checkbox" checked={waitlist} onChange={e => setWaitlist(e.target.checked)} /> Join the waitlist if the slot is taken</label>
        <button className="primary" type="submit">Book</button>
      </form>

      {msg && <div className={`msg ${msg.kind}`}>{msg.text}</div>}

      <h2>Bookings for {room} <span>{page.total} total, earliest first</span></h2>
      {page.items.length === 0 ? <div className="empty">No bookings yet.</div> : (
        <table>
          <thead><tr><th>Guest</th><th>Slot</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {page.items.map(b => (
              <tr key={b.id}>
                <td>{b.guest}{b.attendees.length > 0 && <div className="attendees">with {b.attendees.join(", ")}</div>}</td>
                <td>{fmt(b.slot.start)} – {fmt(b.slot.end)}</td>
                <td><span className={`status ${b.status}`}>{b.status}</span></td>
                <td className="actions">
                  {b.status === "Held" && <button onClick={() => confirm(b.id)}>Confirm</button>}
                  {b.status !== "Cancelled" && <button onClick={() => cancel(b.id)}>Cancel</button>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      {page.total > PAGE_SIZE && (
        <div className="pager">
          <button disabled={offset === 0} onClick={() => setOffset(offset - PAGE_SIZE)}>Previous</button>
          <span>page {pageNo} of {pages}</span>
          <button disabled={pageNo >= pages} onClick={() => setOffset(offset + PAGE_SIZE)}>Next</button>
        </div>
      )}

      <h2>All rooms <span>rebuilt from every room's event history</span></h2>
      <table>
        <thead><tr><th>Room</th><th className="num">Capacity</th><th className="num">Held</th><th className="num">Confirmed</th><th className="num">Waitlisted</th><th className="num">Cancelled</th><th className="num">Distinct guests</th></tr></thead>
        <tbody>
          {stats.slice().sort((a, b) => a.room.localeCompare(b.room)).map(s => (
            <tr key={s.room}>
              <td>{s.name} <span className="cap">({s.room})</span></td>
              <td className="num">{s.capacity}</td><td className="num">{s.held}</td><td className="num">{s.confirmed}</td>
              <td className="num">{s.waitlisted}</td><td className="num">{s.cancelled}</td><td className="num">{s.guests}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
